---
- name: Install ripgrep
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600
      become: true

    - name: Install ripgrep
      ansible.builtin.apt:
        name: ripgrep
        state: present
      become: true

    - name: Check ripgrep version
      ansible.builtin.command: rg --version
      register: rg_version
      changed_when: false

    - name: Report ripgrep installation
      ansible.builtin.debug:
        msg: "{{ rg_version.stdout_lines[0] }}"
